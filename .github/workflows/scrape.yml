
name: Test 591 Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test 591 listing scraper
        env:
          X591URL: "https://rent.591.com.tw/list?region=1&section=7,4,3&price=40000_,30000_40000&layout=3,4"
        run: |
          uv run python collect_list.py --max-pages 1 --quiet

      - name: Show scraper output
        if: always()
        run: |
          if [ -f cache/listings.jbl ]; then
            echo "Listing ID cache was created."
            ls -lh cache/listings.jbl
          else
            echo "Listing ID cache was not created."
          fi
