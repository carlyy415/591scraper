
name: Test 591 Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test 591 listing scraper
        env:
          X591URL: "https://rent.591.com.tw/list?region=1&section=7,4,3&price=30000$_55000$&layout=3,4"
        run: |
          uv run python collect_list.py --max-pages 1 --quiet
          
      - name: Fetch listing details
        env:
          X591URL: "https://rent.591.com.tw/list?region=1&section=7,4,3&price=30000$_55000$&layout=3,4"
        run: |
          uv run python fetch_info.py --limit 3 --headless
          
      - name: Check detail CSV
        if: always()
        run: |
          if [ -f cache/df_listings.csv ]; then
            echo "Detail CSV created."
            ls -lh cache/df_listings.csv
            uv run python -c "import pandas as pd; df=pd.read_csv('cache/df_listings.csv'); print('成功擷取筆數:', len(df)); print(df[['id','title','price']].to_string(index=False))"
          else
            echo "Detail CSV not created."
          fi

      - name: Show scraper output
        if: always()
        run: |
          if [ -f cache/listings.jbl ]; then
            echo "Listing ID cache was created."
            ls -lh cache/listings.jbl
          else
            echo "Listing ID cache was not created."
          fi
          
      - name: Save listing cache as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-cache
          path: cache/listings.jbl
          if-no-files-found: warn
          retention-days: 3

      - name: Save detail CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-listings-csv
          path: cache/df_listings.csv
          if-no-files-found: warn
          retention-days: 7
