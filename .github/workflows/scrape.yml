
name: Test 591 Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test 591 listing scraper
        env:
          X591URL: "https://rent.591.com.tw/list?region=1&section=7,4,3&price=30000$_55000$&layout=3,4&kind=1"
        run: |
          uv run python collect_list.py --max-pages 10 --quiet
          
      - name: Fetch listing details
        env:
          X591URL: "https://rent.591.com.tw/list?region=1&section=7,4,3&price=30000$_55000$&layout=3,4&kind=1"
        run: |
          uv run python fetch_info.py --limit 300 --headless
          
      - name: Check detail CSV
        if: always()
        run: |
          if [ -f cache/df_listings.csv ]; then
            echo "Detail CSV created."
            ls -lh cache/df_listings.csv
            uv run python -c "import pandas as pd; df=pd.read_csv('cache/df_listings.csv'); print('成功擷取筆數:', len(df)); print(df[['id','title','price']].to_string(index=False))"
          else
            echo "Detail CSV not created."
          fi


      - name: Sync CSV to Google Sheets
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          uv run python - <<'PY'
          import csv
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          csv_path = "cache/df_listings.csv"
          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["API_SECRET_KEY"]

          with open(csv_path, "r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          if not rows:
              raise SystemExit("CSV 沒有資料，停止同步。")

          # 每批 30 筆，降低單次 Apps Script 的工作量
          batch_size = 30
          total = len(rows)
          inserted_total = 0
          updated_total = 0

          print("CSV 共 {} 筆，分批同步，每批最多 {} 筆。".format(
              total, batch_size
          ))

          for start in range(0, total, batch_size):
              batch = rows[start:start + batch_size]
              batch_no = start // batch_size + 1
              batch_count = (total + batch_size - 1) // batch_size

              payload = json.dumps({
                  "secret": secret,
                  "rows": batch
              }).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              success = False

              for attempt in range(1, 4):
                  try:
                      print(
                          "同步第 {}/{} 批，{} 筆，第 {} 次嘗試。".format(
                              batch_no, batch_count, len(batch), attempt
                          )
                      )

                      with urllib.request.urlopen(
                          request, timeout=120
                      ) as response:
                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      print(json.dumps(result, ensure_ascii=False))

                      if not result.get("ok"):
                          raise RuntimeError(
                              "Apps Script 回報失敗：{}".format(result)
                          )

                      inserted_total += int(result.get("inserted", 0))
                      updated_total += int(result.get("updated", 0))
                      success = True
                      break

                  except Exception as exc:
                      print("本次同步失敗：{}".format(repr(exc)))

                      if attempt < 3:
                          wait_seconds = attempt * 10
                          print("{} 秒後重試。".format(wait_seconds))
                          time.sleep(wait_seconds)

              if not success:
                  raise SystemExit(
                      "第 {} 批同步失敗，已停止後續批次。".format(batch_no)
                  )

              # 避免連續請求過於密集
              time.sleep(2)

          print("同步全部完成。")
          print("CSV 總筆數：{}".format(total))
          print("新增：{}".format(inserted_total))
          print("更新：{}".format(updated_total))
          PY


      - name: Show scraper output
        if: always()
        run: |
          if [ -f cache/listings.jbl ]; then
            echo "Listing ID cache was created."
            ls -lh cache/listings.jbl
          else
            echo "Listing ID cache was not created."
          fi
          
      - name: Save listing cache as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-cache
          path: cache/listings.jbl
          if-no-files-found: warn
          retention-days: 3

      - name: Save detail CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-listings-csv
          path: cache/df_listings.csv
          if-no-files-found: warn
          retention-days: 7
