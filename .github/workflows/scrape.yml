
name: Test 591 Scraper Browser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Chrome
        run: |
          google-chrome --version

      - name: Check DrissionPage
        run: |
          uv run python -c "from DrissionPage import ChromiumOptions; print('DrissionPage imported successfully')"

